upstream base_service      { server base:8001; }
upstream ore_service       { server ore:8002; }
upstream richieste_service { server richieste:8003; }
upstream password_service  { server password:8004; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ── Password service: PUT /api/users/me (exact match, priority) ─
    location = /api/users/me {
        proxy_pass         http://password_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Base service: auth, users CRUD, ditte ─────────────────────
    location /api/auth/ {
        proxy_pass         http://base_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users/ {
        proxy_pass         http://base_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ditte/ {
        proxy_pass         http://base_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Ore service: commesse, ore ────────────────────────────────
    location /api/commesse/ {
        proxy_pass         http://ore_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ore/ {
        proxy_pass         http://ore_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Richieste service: bookings ───────────────────────────────
    location /api/bookings/ {
        proxy_pass         http://richieste_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Health aggregati ──────────────────────────────────────────
    location = /health/base {
        proxy_pass http://base_service/health;
        proxy_set_header Host $host;
    }
    location = /health/ore {
        proxy_pass http://ore_service/health;
        proxy_set_header Host $host;
    }
    location = /health/richieste {
        proxy_pass http://richieste_service/health;
        proxy_set_header Host $host;
    }
    location = /health/password {
        proxy_pass http://password_service/health;
        proxy_set_header Host $host;
    }
}
